[package]
name = "xmanager-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "XManager desktop app (Tauri) for low-view tweet management"
default-run = "xmanager"

[[bin]]
name = "xmanager"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# This feature is used for production builds or when `devPath` points to the
# filesystem. DO NOT REMOVE! It embeds ui/dist instead of loading devUrl.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
xmanager-core.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
