[workspace]
resolver = "2"
members = [
    "crates/xmanager-core",
    "crates/xmanager-tauri/src-tauri",
    "crates/xmanager-cli",
]
default-members = ["crates/xmanager-tauri/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["XManager"]
repository = "https://github.com/nicechencs/XManager"

[workspace.dependencies]
xmanager-core = { path = "crates/xmanager-core" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
csv = "1.3"
dotenvy = "0.15"
oauth1-request = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
